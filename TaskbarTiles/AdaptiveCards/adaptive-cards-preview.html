<!DOCTYPE html>

<style>
  body {
    font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    background: #1a1a1a;
    color: #fff;
    padding: 32px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  h2 {
    font-size: 14px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0;
  }

  .card-wrapper {
    width: 380px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  /* Dark theme overrides for the Adaptive Card renderer */
  .card-wrapper .ac-container {
    background: #2c2c2c !important;
  }

  .card-wrapper .ac-textBlock {
    color: #e0e0e0 !important;
  }

  .card-wrapper .ac-pushButton {
    background: rgba(255,255,255,0.06) !important;
    border: 1px solid rgba(255,255,255,0.08) !important;
    color: #fff !important;
    border-radius: 4px !important;
    font-family: 'Segoe UI Variable', sans-serif !important;
  }

  .card-wrapper .ac-pushButton.style-positive {
    background: #60cdff !important;
    color: #000 !important;
    border: none !important;
    font-weight: 600 !important;
  }
</style>
</head>

function renderCard(payload, containerId) {
  const adaptiveCard = new AdaptiveCards.AdaptiveCard();

  // Dark host config

    fontFamily: "'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif",

      default: {

          warning: { default: "#fce100", subtle: "#fce100" },

  const renderedCard = adaptiveCard.render();
  renderedCard.style.borderRadius = '8px';
  document.getElementById(containerId).appendChild(renderedCard);
